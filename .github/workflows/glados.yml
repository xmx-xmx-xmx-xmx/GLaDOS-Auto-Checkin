name: GLaDOS Auto Checkin

on:
  workflow_dispatch:  # 手动触发
  schedule:
    # GitHub 的 schedule 是「尽力而为」：整点最拥堵，可能延迟数小时甚至被丢弃。
    # 因此错开分钟（避开 :00），并排三次做冗余：任一次命中即可完成签到，
    # 后续几次命中「已签到」时脚本会自动静默，不会重复推送。
    - cron: '7 4 * * *'    # 主时段：北京时间 12:07
    - cron: '23 6 * * *'   # 兜底 1：北京时间 14:23
    - cron: '41 8 * * *'   # 兜底 2：北京时间 16:41
    - cron: '0 0 1 * *'    # 每月 1 号保活空提交

jobs:
  checkin:
    name: GLaDOS 签到
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule' || github.event.schedule != '0 0 1 * *'
    concurrency:
      group: glados-checkin
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "requests==2.32.3" --no-cache-dir

      - name: Run checkin
        run: python checkin.py
        env:
          COOKIES: ${{ secrets.COOKIES || vars.COOKIES }}
          # 设备校验：填「登录过 glados.cloud 的那台设备」的完整 User-Agent。
          # 不填也能跑——脚本会在被设备校验拦截时按 loginDevice 自动切换 UA 重试。
          GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT || vars.GLADOS_USER_AGENT }}
          # 触发来源：定时冗余调度时用于「全部已签到则静默」，手动触发仍照常推送
          GLADOS_EVENT_NAME: ${{ github.event_name }}
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          YUNHU_TOKEN: ${{ secrets.YUNHU_TOKEN }}
          YUNHU_RECV_ID: ${{ secrets.YUNHU_RECV_ID }}
          YUNHU_RECV_TYPE: ${{ secrets.YUNHU_RECV_TYPE }}
          # #9 积分兑换计划（可选；不配置则默认不兑换，不影响现有签到）
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}

  keepalive:
    name: 每月空提交保活
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: glados-keepalive
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 创建空提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
